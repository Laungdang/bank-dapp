<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank DApp - 66010639</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #3949ab 100%); min-height: 100vh; padding: 24px 16px; }
  .container { max-width: 520px; margin: 0 auto; }
  header { text-align: center; color: #fff; margin-bottom: 24px; }
  header h1 { font-size: 1.9rem; margin-bottom: 8px; }
  .student-info { background: rgba(255,255,255,.15); border-radius: 12px; padding: 10px 16px; display: inline-block; font-size: .95rem; line-height: 1.6; }
  .card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
  .card h2 { font-size: 1.05rem; color: #1a237e; margin-bottom: 12px; }
  button { background: #3949ab; color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; font-size: 1rem; cursor: pointer; width: 100%; transition: background .2s; }
  button:hover { background: #283593; }
  button:disabled { background: #9fa8da; cursor: not-allowed; }
  input { width: 100%; padding: 12px; border: 2px solid #c5cae9; border-radius: 10px; font-size: 1rem; margin-bottom: 10px; }
  input:focus { outline: none; border-color: #3949ab; }
  .addr { font-family: monospace; font-size: .8rem; word-break: break-all; color: #555; margin-top: 10px; }
  .balance-num { font-size: 2rem; font-weight: 700; color: #1a237e; text-align: center; margin: 10px 0; }
  .balance-unit { font-size: 1rem; color: #777; }
  #status { color: #fff; text-align: center; font-size: .9rem; min-height: 1.4em; margin-top: 4px; word-break: break-word; }
  .row { display: flex; gap: 10px; }
  .row button { flex: 1; }
  .badge { display: inline-block; background: #e8eaf6; color: #283593; border-radius: 8px; padding: 2px 10px; font-size: .8rem; margin-left: 6px; }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>🏦 Bank DApp</h1>
    <div class="student-info">
      รหัสนักศึกษา: <b>66010639</b><br>
      ชื่อ-สกุล: <b>หลาวแดง อินคำ</b> 
    </div>
  </header>

  <!-- การเชื่อมต่อ MetaMask -->
  <div class="card">
    <h2>🦊 เชื่อมต่อกระเป๋า <span id="netBadge" class="badge" style="display:none">Sepolia</span></h2>
    <button id="btnConnect" onclick="connectWallet()">Connect MetaMask</button>
    <div class="addr" id="account">ยังไม่ได้เชื่อมต่อ</div>
  </div>

  <!-- CheckBalance -->
  <div class="card">
    <h2>💰 ยอดเงินฝากของฉัน (Check Balance)</h2>
    <div class="balance-num"><span id="balance">-</span> <span class="balance-unit">ETH</span></div>
    <button onclick="checkBalance()">ตรวจสอบยอดเงิน</button>
  </div>

  <!-- Deposit -->
  <div class="card">
    <h2>📥 ฝากเงิน (Deposit)</h2>
    <input id="depositAmount" type="number" step="0.001" min="0" placeholder="จำนวน ETH เช่น 0.001">
    <button onclick="deposit()">ฝากเงิน</button>
  </div>

  <!-- Withdraw -->
  <div class="card">
    <h2>📤 ถอนเงิน (Withdraw)</h2>
    <input id="withdrawAmount" type="number" step="0.001" min="0" placeholder="จำนวน ETH เช่น 0.001">
    <button onclick="withdraw()">ถอนเงิน</button>
  </div>

  <p id="status"></p>
</div>

<script>
// ============================================================
// ★ ตั้งค่า: วาง address ของ Bank contract ที่ deploy บน Sepolia
// ============================================================
const CONTRACT_ADDRESS = "0x445566E10c5a27e3b67713a44a6C944BCC48d454";

// ABI ของ Bank contract (ชื่อฟังก์ชัน checkBlance ตามโค้ดอาจารย์เป๊ะ ๆ)
const ABI = [
  "function deposit() public payable",
  "function withdraw(uint256 amount) public",
  "function checkBlance() public view returns (uint256 balance)",
  "event Deposit(address indexed owner, uint256 amount)",
  "event Withdraw(address indexed owner, uint256 amount)"
];

const SEPOLIA_CHAIN_ID = 11155111n;
let provider, signer, contract;

function setStatus(msg) { document.getElementById("status").textContent = msg; }

// ---------- การเชื่อมต่อ MetaMask + Smart Contract ----------
async function connectWallet() {
  try {
    if (!window.ethereum) { setStatus("ไม่พบ MetaMask กรุณาติดตั้งก่อนครับ"); return; }
    setStatus("กำลังเชื่อมต่อ...");

    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);

    // ถ้าไม่ใช่ Sepolia ให้สลับเครือข่ายอัตโนมัติ
    let network = await provider.getNetwork();
    if (network.chainId !== SEPOLIA_CHAIN_ID) {
      await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: "0xaa36a7" }]   // 11155111 = Sepolia
      });
      provider = new ethers.BrowserProvider(window.ethereum);
    }

    signer = await provider.getSigner();
    contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);

    document.getElementById("account").textContent = "เชื่อมต่อแล้ว: " + signer.address;
    document.getElementById("btnConnect").textContent = "เชื่อมต่อสำเร็จ ✓";
    document.getElementById("netBadge").style.display = "inline-block";
    setStatus("");
    checkBalance();
  } catch (e) {
    setStatus("เชื่อมต่อไม่สำเร็จ: " + (e.shortMessage || e.message));
  }
}

function requireConnect() {
  if (!contract) { setStatus("กรุณากด Connect MetaMask ก่อนครับ"); return false; }
  return true;
}

// ---------- Deposit ----------
async function deposit() {
  if (!requireConnect()) return;
  const amt = document.getElementById("depositAmount").value;
  if (!amt || Number(amt) <= 0) { setStatus("กรุณาใส่จำนวนเงินที่จะฝาก"); return; }
  try {
    setStatus("กำลังฝากเงิน " + amt + " ETH ... (ยืนยันใน MetaMask)");
    const tx = await contract.deposit({ value: ethers.parseEther(amt) });
    await tx.wait();
    setStatus("ฝากเงินสำเร็จ ✓ (tx: " + tx.hash.slice(0, 18) + "...)");
    document.getElementById("depositAmount").value = "";
    checkBalance();
  } catch (e) {
    setStatus("ฝากเงินไม่สำเร็จ: " + (e.shortMessage || e.message));
  }
}

// ---------- Withdraw ----------
async function withdraw() {
  if (!requireConnect()) return;
  const amt = document.getElementById("withdrawAmount").value;
  if (!amt || Number(amt) <= 0) { setStatus("กรุณาใส่จำนวนเงินที่จะถอน"); return; }
  try {
    setStatus("กำลังถอนเงิน " + amt + " ETH ... (ยืนยันใน MetaMask)");
    const tx = await contract.withdraw(ethers.parseEther(amt));
    await tx.wait();
    setStatus("ถอนเงินสำเร็จ ✓ (tx: " + tx.hash.slice(0, 18) + "...)");
    document.getElementById("withdrawAmount").value = "";
    checkBalance();
  } catch (e) {
    setStatus("ถอนเงินไม่สำเร็จ: " + (e.shortMessage || e.message));
  }
}

// ---------- CheckBalance ----------
async function checkBalance() {
  if (!requireConnect()) return;
  try {
    const bal = await contract.checkBlance();
    document.getElementById("balance").textContent = ethers.formatEther(bal);
    setStatus("");
  } catch (e) {
    setStatus("อ่านยอดเงินไม่สำเร็จ: " + (e.shortMessage || e.message));
  }
}
</script>
</body>
</html>
